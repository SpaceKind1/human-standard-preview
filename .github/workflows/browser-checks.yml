name: Browser checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Chromium on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Select Playwright's installed browser
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                  print(f'PREVIEW_BROWSER_EXECUTABLE={playwright.chromium.executable_path}', file=output)
      - name: Run browser regression tests
        run: python -m unittest discover -s tests -v
